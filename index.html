<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Where Intelligence Builds the Future</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="landing-container">
    <div class="background-effects">
      <div class="glow-orb blue"></div>
      <div class="glow-orb purple"></div>
      <div class="glow-orb pink"></div>
    </div>
    
    <main class="content">
      <section class="text-section">
        <h1 class="headline">
          <span class="fade-in-text">Where</span>
          <span class="fade-in-text delay-1">Intelligence</span>
          <span class="fade-in-text delay-2">Builds the</span>
          <span class="highlight fade-in-text delay-3">Future</span>
        </h1>
        <p class="subtitle fade-in-text delay-4">
          Experience the fusion of tradition and futuristic AI. 
        </p>
        <button class="cta-button fade-in-text delay-5">
          <span>Discover More</span>
          <div class="btn-glow"></div>
        </button>
      </section>

      <section class="image-section fade-in-scale">
        <div class="image-wrapper">
          <img src="public/images/samurai-nobg.png" alt="Cute Cyberpunk Samurai" class="hero-image">
          <div class="image-glow"></div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
